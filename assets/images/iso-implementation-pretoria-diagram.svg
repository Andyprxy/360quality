 <path d="M0 86H980" stroke="#dfe9f2"/><text x="52" y="50" font-family="Arial,sans-serif" font-size="13" letter-spacing="3.5" font-weight="700" fill="#52728e">360 QUALITY SOLUTIONS  /  CONSULTING FRAMEWORK</text>
 <text x="52" y="124" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#142b48" text-anchor="start">From requirements to an embedded management system</text><text x="52" y="154" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#55708a" text-anchor="start">A practical implementation cycle — tailored to the organisation.</text><rect x="52" y="206" width="208" height="188" rx="19" fill="#ffffff" stroke="#dbe8f2" stroke-width="1"/><rect x="52" y="206" width="208" height="7" rx="4" fill="#143d64"/><text x="76" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#2c77ab" text-anchor="start">01</text><text x="76" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="750" fill="#142b48" text-anchor="start">SCOPE</text><text x="76" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">Understand context</text><text x="76" y="350" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">&amp; requirements</text><path d="M262 294h16" fill="none" stroke="#76a7ca" stroke-width="3"/><path d="m272 287 7 7-7 7" fill="none" stroke="#76a7ca" stroke-width="3"/><rect x="283" y="206" width="208" height="188" rx="19" fill="#ffffff" stroke="#dbe8f2" stroke-width="1"/><rect x="283" y="206" width="208" height="7" rx="4" fill="#216498"/><text x="307" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#2c77ab" text-anchor="start">02</text><text x="307" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="750" fill="#142b48" text-anchor="start">DESIGN</text><text x="307" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">Map processes</text><text x="307" y="350" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">&amp; controls</text><path d="M493 294h16" fill="none" stroke="#76a7ca" stroke-width="3"/><path d="m503 287 7 7-7 7" fill="none" stroke="#76a7ca" stroke-width="3"/><rect x="514" y="206" width="208" height="188" rx="19" fill="#ffffff" stroke="#dbe8f2" stroke-width="1"/><rect x="514" y="206" width="208" height="7" rx="4" fill="#2e7ead"/><text x="538" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#2c77ab" text-anchor="start">03</text><text x="538" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="750" fill="#142b48" text-anchor="start">EMBED</text><text x="538" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">Train teams</text><text x="538" y="350" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">&amp; use the system</text><path d="M724 294h16" fill="none" stroke="#76a7ca" stroke-width="3"/><path d="m734 287 7 7-7 7" fill="none" stroke="#76a7ca" stroke-width="3"/><rect x="745" y="206" width="208" height="188" rx="19" fill="#ffffff" stroke="#dbe8f2" stroke-width="1"/><rect x="745" y="206" width="208" height="7" rx="4" fill="#4d99c4"/><text x="769" y="252" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#2c77ab" text-anchor="start">04</text><text x="769" y="286" font-family="Arial,sans-serif" font-size="21" font-weight="750" fill="#142b48" text-anchor="start">VERIFY</text><text x="769" y="326" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">Audit, review</text><text x="769" y="350" font-family="Arial,sans-serif" font-size="16" font-weight="500" fill="#55708a" text-anchor="start">&amp; improve</text><rect x="52" y="423" width="876" height="58" rx="12" fill="#e1edf7" stroke="#e1edf7" stroke-width="1"/><circle cx="76" cy="452" r="7" fill="#3a82b1"/><text x="97" y="458" font-family="Arial,sans-serif" font-size="15" font-weight="550" fill="#142b48" text-anchor="start">Outcome: a usable system, with ownership, documented evidence and an improvement rhythm.</text></svg>
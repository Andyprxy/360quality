00" fill="#55708a" text-anchor="start">Update records</text><text x="80" y="375" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#142b48" text-anchor="start">Operational records</text><rect x="499" y="354" width="150" height="32" rx="16" fill="#ffe8e7" stroke="#ffe8e7" stroke-width="1"/><text x="574" y="376" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#b2504d" text-anchor="middle">Gap identified</text><text x="693" y="375" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#55708a" text-anchor="start">Assign corrective action</text><rect x="54" y="396" width="872" height="50" fill="#f7fafc"/><text x="80" y="425" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#142b48" text-anchor="start">Performance review</text><rect x="499" y="404" width="150" height="32" rx="16" fill="#dfebf3" stroke="#dfebf3" stroke-width="1"/><text x="574" y="426" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#245d85" text-anchor="middle">Reviewed</text><text x="693" y="425" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="#55708a" text-anchor="start">Monitor effectiveness</text><text x="54" y="499" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#2c77ab" text-anchor="start">Interpretation → prioritised findings → ownership → closure plan</text></svg>